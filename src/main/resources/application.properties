spring.application.name=auth
server.port=${SERVER_PORT:8081}

# Secrets come from environment variables. For local runs, put them in a .env file
# at the repo root (see .env.example); it is git-ignored.
spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wallet}
# Creates the unique index on users.email
spring.data.mongodb.auto-index-creation=true

# Account service, called directly (not through the gateway) to open the wallet of new users
app.accounts.base-url=${ACCOUNTS_BASE_URL:http://localhost:8082}

# JWT shared with the account service and the gateway (at least 32 bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mvc.problemdetails.enabled=true
